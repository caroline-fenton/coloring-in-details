name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Smoke test
        run: |
          npm test
          node scripts/preview-worker-test.mjs
          node scripts/package-pages-test.mjs

      - name: Checkout responsive preview
        id: preview
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          ref: codex/responsive-phone-preview
          path: .preview-source

      - name: Test preview
        if: ${{ steps.preview.outcome == 'success' }}
        working-directory: .preview-source
        run: |
          node --check app.js
          npm test

      - name: Package live app and isolated preview
        env:
          PREVIEW_READY: ${{ steps.preview.outcome == 'success' }}
        run: |
          if [ "$PREVIEW_READY" = "true" ]; then
            node scripts/package-pages.mjs --preview
          else
            node scripts/package-pages.mjs
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .pages-output

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
